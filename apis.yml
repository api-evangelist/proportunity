name: Proportunity
description: >-
  Proportunity is a London-based proptech/fintech mortgage lender, founded in
  2016 by Vadim Toader and Stefan Boronea, that helps first-time buyers get onto
  the property ladder with a shared-equity loan. The Proportunity Loan
  supplements a buyer's deposit and can boost purchasing power by up to
  GBP 150,000, letting buyers secure a home with as little as a 5% deposit on any
  property on the market (not just new-builds). The company uses machine-learning
  models to forecast house prices and identify fair-valued homes in high-growth
  areas to reduce financing risk. Proportunity is authorised and regulated by the
  UK Financial Conduct Authority (FRN 716565). It was surfaced as a portfolio
  company of Anthemis and added to the API Evangelist network; enrichment found
  no public developer/API surface (consumer-facing product only).
